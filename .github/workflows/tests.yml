name: tests

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: credit-risk-champion-challenger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
